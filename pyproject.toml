[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "etrade-mcp"
dynamic = ["version"]
description = "MCP server for E*TRADE accounts"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastmcp>=4.2.2",
    "pydantic>=2.14.4",
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
]

[project.scripts]
etrade-mcp = "etrade_mcp.server:main"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "loq>=0.2.0",
    "prek>=0.5.10",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-env>=1.8.6",
    "ruff>=0.17.5",
    "types-requests>=2.33.0.20261030",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/etrade_mcp"]

[tool.pytest.ini_options]
addopts = [
    "--cov",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
    "--strict-markers",
    "--strict-config",
    "-Werror",
    # py-key-value-aio runs beartype on its own classes under pytest, and
    # beartype calls isinstance() on their AsyncKeyValue protocol, which is
    # not @runtime_checkable.  Python 3.15 deprecates that call, so beartype
    # skips those classes and warns that it did.  Only py-key-value-aio
    # brings beartype in, so the whole category is safe to ignore.
    "-Wignore::beartype.roar.BeartypeClawDecorWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
env = [
    "ETRADE_CONSUMER_KEY=test_consumer_key",
    "ETRADE_CONSUMER_SECRET=test_consumer_secret",
    "ETRADE_ENVIRONMENT=sandbox",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.coverage.run]
source = ["src/etrade_mcp", "tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.codespell]
# E*TRADE's own API examples spell it this way, and the tests copy them.
ignore-words-list = "withdrawl"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (enforce modern python syntax)
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Shared"]

[tool.ruff.lint.per-file-ignores]
"src/etrade_mcp/oauth_web_server.py" = ["E501"]  # Allow long lines in HTML templates
